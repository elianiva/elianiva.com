<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="alternate" href="/rss.xml" type="application/rss+xml" title="elianiva" />
    <!-- The body font is otherwise only discovered after the CSS parses. -->
    <link
      rel="preload"
      href="/app/assets/fonts/google-sans-subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/app/styles.css" />
    <!-- Pages are separate documents: warm the next one while the pointer is on its link. -->
    <script type="speculationrules">
      {
        "prerender": [
          {
            "where": {
              "and": [
                { "href_matches": "/*" },
                { "not": { "href_matches": "/api/*" } },
                { "not": { "href_matches": "/*.*" } }
              ]
            },
            "eagerness": "moderate"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/app/entry.client.ts"></script>
  </body>
</html>
