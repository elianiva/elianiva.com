services:
  web:
    # TanStack Start dev server (server.port: 3000 in vite.config.ts) with hot reload.
    # VITE_GH_TOKEN / VITE_LASTFM_API_KEY are optional: without real values the
    # GitHub/music sections degrade to empty data via their service fallbacks.
    command: >-
      VITE_GH_TOKEN="${VITE_GH_TOKEN:-}" VITE_LASTFM_API_KEY="${VITE_LASTFM_API_KEY:-}"
      pnpm dev
    port: 3000
    health: /
    portal:
      url: /
      title: elianiva.com
      description: Local TanStack Start dev server with hot reload.
