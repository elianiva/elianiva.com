services:
  web:
    # TanStack Start dev server (server.port: 3000 in vite.config.ts) with hot reload.
    # GH_TOKEN / LASTFM_API_KEY are read per request by server functions.
    # Export real values for live GitHub/music data; without them the
    # GitHub/music sections degrade to empty data via their service fallbacks.
    command: >-
      GH_TOKEN="${GH_TOKEN:-}" LASTFM_API_KEY="${LASTFM_API_KEY:-}"
      pnpm dev
    port: 3000
    health: /
    portal:
      url: /
      title: elianiva.com
      description: Local TanStack Start dev server with hot reload.
