allowBuilds:
  esbuild: true
  lightningcss: true
  msw: true
  sharp: true
  msgpackr-extract: false
  workerd: true
minimumReleaseAge: 0
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.3
  vite-plus: 1.1.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # @tailwindcss/node@4.3.3 pins lightningcss 1.32.0 while the rest of the
  # toolchain (vite-plus-core, @tanstack/start-plugin-core) already uses
  # 1.33.0. Pin to the newer one so a single copy is installed and bundled.
  lightningcss: "1.33.0"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
