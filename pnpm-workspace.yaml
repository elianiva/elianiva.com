allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lightningcss: true
  msw: true
  sharp: true
  msgpackr-extract: false
  workerd: true
minimumReleaseAge: 0
catalog:
  # vite-plus and its vite alias no longer share a version. Core encodes the
  # bundled Vite version: 8.3.8000 is Vite 8.3.8.
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.0
  vite-plus: 1.7.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # @tailwindcss/node@4.3.3 pins lightningcss 1.32.0 while the rest of the
  # toolchain (vite-plus-core, @tanstack/start-plugin-core) already uses
  # 1.33.0. Pin to the newer one so a single copy is installed and bundled.
  lightningcss: "1.33.0"
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - tsrs
  - "@tsrs/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
